name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Le nom de ce job est aussi celui du « check run » GitHub que le Pi exige
  # avant d'appliquer un commit (voir scripts/self_update.sh et
  # SELF_UPDATE_REQUIRED_CHECK) : le renommer casserait la mise à jour
  # automatique.
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compilation
        run: python -m compileall -q app main.py scripts/ci_status.py
      - name: Tests
        run: python -m pytest -q
