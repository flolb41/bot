# Configuration du bot d'arbitrage inter-DEX (Crypto Reward Hunter).
# Les secrets (token Telegram, etc.) viennent du fichier .env (jamais ici en clair).

logging:
  level: INFO
  file: logs/app.log

database:
  path: data/reward_hunter.db

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

scheduler:
  # Fréquence du scan d'arbitrage inter-DEX (bot de trading, LIVE). 14 appels
  # DEX Screener par CYCLE (1 par token seed — 14 seed tokens au 08/10, pas 5),
  # throttlés à 1,1s d'intervalle (voir app/trading/dex_sources.py) : ~14
  # req/min même à 1 min d'intervalle, très en dessous de la limite documentée
  # de 60 req/min. CoinGecko est mis en cache 10 min indépendamment de cette
  # fréquence (pas d'appel supplémentaire).
  #
  # Abaissé de 3 à 1 min le 08/10, APRÈS avoir corrigé un bug distinct qui
  # rendait cette valeur sans effet : `run_arbitrage_scan`, `run_triangular_scan`
  # ET `run_cross_dex_triangular_scan` (tous appelés dans le même cycle, voir
  # app/scheduler.py::run_arbitrage_scan_job) interrogeaient CHACUN DexScreener
  # indépendamment pour les MÊMES tokens/whitelist/liquidité (39 appels/cycle,
  # pas 13), faisant déjà dépasser la durée réelle d'un cycle au-delà de 3 min
  # — confirmé en production : "maximum number of running instances reached"
  # sur la quasi-totalité des ticks programmés. Un seul fetch partagé par
  # cycle (voir app/trading/arbitrage.py::collect_pairs_for_config) règle ce
  # problème ET justifie de pouvoir descendre à 1 min sans risquer de
  # surcharger DexScreener ni de faire chevaucher les cycles.
  arbitrage_scan_interval_minutes: 1

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8000

# Bot de trading : arbitrage inter-DEX sur Base (demande "microtrades + seuil de
# rentabilité"). PHASE 2 = EXÉCUTION LIVE ACTIVÉE (décision explicite de
# l'utilisateur le 2026-10-07, confirmée après rappel des risques). `enabled: true`
# ne suffit PAS à lui seul : voir app/trading/guardrails.py::is_trading_live —
# il faut EN PLUS TRADING_ENABLED=true et TRADING_LIVE_CONFIRMED=<phrase exacte>
# dans le .env du Pi (jamais ici), et un wallet de trading importé + approvisionné.
#
# Capital de test ciblé par l'utilisateur : 5 $ (wallet MetaMask principal,
# décision explicite malgré le risque signalé). `max_trade_size_usd` et les
# seuils de rentabilité ci-dessous sont calibrés pour ce montant : à ce stade
# les frais de gas Base (quelques millièmes de $) sont négligeables, ce sont
# les frais DEX (~0,6 % aller-retour) + la marge de slippage qui dominent le
# seuil de rentabilité réel.
trading:
  enabled: true
  chain: base
  # balancer/curve/maverick ajoutés le 2026-10-08 en DÉTECTION SEULE (jamais
  # ajoutés à `app.trading.routers.EXECUTABLE_DEXES` : toute tentative
  # d'exécution dessus est refusée proprement par `executor.py`/`flashloan.py`,
  # voir leur vérification `dex not in EXECUTABLE_DEXES` — zéro risque de
  # fonds, juste des signaux "non rentable/non exécutable" supplémentaires à
  # titre informatif). Vérifié via DexScreener le 2026-10-08 : "balancer" a
  # une présence réelle mais très faible sur Base pour nos seed tokens
  # actuels (quelques centaines à ~1200 $ de liquidité, sous notre plancher
  # `min_liquidity_usd: 10000` — n'ajoute donc aucun signal exploitable pour
  # l'instant, gardé pour le cas où sa liquidité grossirait). "curve" et
  # "maverick" n'ont aucune pool détectée sur Base pour nos seed tokens
  # actuels (aucun dexId "curve"/"maverick" dans les réponses DexScreener
  # observées) : gardés quand même dans la liste (aucun coût, juste une
  # chaîne qui ne matchera jamais tant qu'aucune pool n'existe) plutôt que
  # d'exiger un redéploiement le jour où ça change.
  dex_whitelist: [uniswap, aerodrome, sushiswap, pancakeswap, baseswap, alien-base, swapbased, balancer, curve, maverick]
  # Tokens de départ pour la recherche de paires inter-DEX (adresses Base
  # vérifiées via DEUX sources indépendantes — DEX Screener + CoinGecko — avant
  # ajout ici : ne jamais ajouter une adresse non recoupée de cette façon).
  seed_tokens:
    - symbol: WETH
      address: "0x4200000000000000000000000000000000000006"
      coingecko_id: ethereum
    - symbol: USDC
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      coingecko_id: usd-coin
    - symbol: AERO
      address: "0x940181a94A35A4569E4529A3CDfB74e38FD98631"
      coingecko_id: aerodrome-finance
    - symbol: cbETH
      address: "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"
      coingecko_id: coinbase-wrapped-staked-eth
    # DEGEN et BRETT ajoutés le 2026-10-08 : tokens natifs Base très liquides
    # (rank CoinGecko ~600/~450), adresses vérifiées via DEUX sources
    # indépendantes (API CoinGecko officielle + pools listées dans la doc
    # SwapBased, recoupées avec DexScreener). Volatilité plus forte que les
    # seed tokens existants -> spreads inter-DEX potentiellement plus larges.
    - symbol: DEGEN
      address: "0x4ed4E862860beD51a9570b96d89aF5E1B0Efefed"
      coingecko_id: degen-base
    - symbol: BRETT
      address: "0x532f27101965dd16442e59d40670faf5ebb142e4"
      coingecko_id: based-brett
    # DAI et USDT (bridgé) ajoutés le 2026-10-08 : stablecoins très liquides
    # sur Base, complémentaires à USDC/USDbC pour la détection d'écarts
    # inter-stablecoins (Curve/Balancer en sont justement friands) et pour
    # ouvrir de nouveaux cycles triangulaires. Adresses vérifiées via DEUX
    # sources indépendantes : étiquette BaseScan ("Dai Stablecoin"/"Tether
    # USD" vérifiées) + métadonnées on-chain DexScreener concordantes
    # (name/symbol identiques, pools réelles avec USDC confirmées).
    - symbol: DAI
      address: "0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"
      coingecko_id: dai
    - symbol: USDT
      address: "0xfde4C96c8593536E31F229EA8f37b2ADa2699bb2"
      coingecko_id: tether
    # cbBTC retiré le 2026-10-08 : sur 505 signaux observés en 24h, 1 seul
    # jugé rentable (spread moyen 0,41 %, systématiquement mangé par les
    # frais DEX ~0,6 % aller-retour) — consomme un appel DexScreener par scan
    # pour quasiment aucune opportunité exploitable.
    # VIRTUAL et TOSHI ajoutés le 2026-10-08 : adresses vérifiées via DEUX
    # sources indépendantes (API DexScreener + API CoinGecko officielle,
    # adresses Base concordantes). VIRTUAL dispose d'une liquidité et d'un
    # volume très supérieurs aux seed tokens volatils existants (DEGEN/BRETT) :
    # ~585k$ (uniswap/WETH) + ~352k$ et ~237k$ (aerodrome/WETH, 2 pools) +
    # ~191k$ (pancakeswap/USDC), pour >1M$/j de volume rien que sur la paire
    # aerodrome — sur 3 DEX déjà whitelistés, largement au-dessus de
    # `min_liquidity_usd: 10000`. TOSHI a une présence multi-DEX plus modeste
    # (uniswap ~1.1M$ + aerodrome ~31k$, les deux contre WETH, volume
    # ~90k$/j) mais reste au-dessus du plancher de liquidité sur 2 DEX whitelistés.
    - symbol: VIRTUAL
      address: "0x0b3e328455c4059EEb9e3f84b5543F74E24e7E1b"
      coingecko_id: virtual-protocol
    - symbol: TOSHI
      address: "0xAC1Bd2486aAf3B5C0fc3Fd868558b082a531B2B4"
      coingecko_id: toshi
    # EURC, MORPHO et ZORA ajoutés le 2026-10-08 : adresses vérifiées via DEUX
    # sources indépendantes (API CoinGecko officielle `platforms.base` + API
    # DexScreener en direct, pools confirmées). Critère retenu cette fois :
    # même quote token sur ≥2 DEX whitelistés (condition nécessaire pour que
    # `_collect_pairs` les groupe sous la même paire canonique et génère un
    # signal — un token coté WETH sur un DEX et USDC sur un autre ne produit
    # JAMAIS de signal, même si chacun est individuellement très liquide ;
    # exclu pour cette raison : SPX6900, MOG, tBTC).
    # - EURC (Euro Coin, Circle, rank CoinGecko #118) : coté USDC sur 4 DEX
    #   whitelistés — aerodrome (~1,5M$, ~3,6M$/j), pancakeswap (~132k$),
    #   uniswap (~113k$), alien-base (~46k$). Stablecoin EUR/USD : spread
    #   potentiellement plus stable/récurrent (tracking de parité) que les
    #   tokens volatils, à surveiller.
    # - MORPHO (protocole de prêt, rank #61) : coté WETH sur 2 DEX — aerodrome
    #   (~940k$, ~1,9M$/j) et uniswap (~908k$, ~932k$/j). Liquidité/volume très
    #   supérieurs aux seed tokens volatils existants (DEGEN/BRETT).
    # - ZORA (écosystème Zora, rank #650) : coté USDC sur 2 DEX — aerodrome
    #   (~78k$, ~247k$/j) et uniswap (~76k$, ~46k$/j). Plus modeste que
    #   MORPHO/EURC mais au-dessus du plancher de liquidité sur les deux DEX.
    # Écartés lors de cette recherche : WEETH (liquidité aerodrome élevée mais
    # volume quasi nul ~1$/j — prix potentiellement figé/non réaliste), WELL/
    # Moonwell (exploit ~8,7M$ signalé récemment sur leur protocole), cbBTC
    # (déjà retiré le 2026-10-08, rentabilité testée insuffisante).
    - symbol: EURC
      address: "0x60a3e35cc302bfa44cb288bc5a4f316fdb1adb42"
      coingecko_id: euro-coin
    - symbol: MORPHO
      address: "0xbaa5cc21fd487b8fcc2f632f3f4e8d37262a0842"
      coingecko_id: morpho
    - symbol: ZORA
      address: "0x1111111111166b7fe7bd91427724b487980afc69"
      coingecko_id: zora
    # wstETH (Wrapped liquid staked Ether, bridgé via Superbridge) ajouté le
    # 08/10 : adresse vérifiée via DEUX sources indépendantes (API CoinGecko
    # officielle `platforms.base` + API DexScreener en direct). Coté WETH sur
    # 2 DEX whitelistés — uniswap (~98k$) et aerodrome (~859k$, ~10 achats/8
    # ventes en 24h, pool active malgré un volume modeste pour sa taille) —
    # satisfait le critère "même quote token sur ≥2 DEX whitelistés". LST
    # (Lido) : volatilité de prix nettement plus faible que DEGEN/BRETT, mais
    # dérive lentement vs WETH (taux de staking), source de spread récurrent.
    # Écartés lors de cette recherche : EIGEN (une seule pool DexScreener
    # détectée, aerodrome/WETH ~15k$ — aucun second DEX pour former une paire),
    # SEAM/Seamless (pool USDC principale ~55k$ sur uniswap mais toutes les
    # pools concurrentes sous 10k$ — pas de second DEX exploitable).
    - symbol: wstETH
      address: "0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452"
      coingecko_id: superbridge-bridged-wsteth-base
  min_liquidity_usd: 10000        # ignore les pools trop fines (risque de prix manipulé/non réaliste)
  max_trade_size_usd: 3           # plafond de secours si le solde réel est illisible (RPC down, etc.)
  # Dimensionnement dynamique : taille de trade = cette fraction du solde
  # RÉEL (USDC ou WETH, selon la devise de cotation du signal) du wallet de
  # trading (relu à chaque scan), au lieu d'un montant fixe.
  # Le coût de gas n'est PAS affecté (indépendant de la taille du trade, voir
  # `fees.estimate_gas_cost_usd`) : seul le montant tradé augmente avec le
  # capital disponible. Mettre à 0 pour désactiver et retomber sur
  # `max_trade_size_usd` fixe. Reste toujours borné par `liquidity_safety_fraction`
  # (jamais plus de 2% de la plus petite liquidité de pool, même si 80% du
  # capital dépasserait ce seuil).
  trade_size_capital_fraction: 0.8
  liquidity_safety_fraction: 0.02 # taille de trade ≤ 2% de la plus petite liquidité des deux pools
  min_spread_pct_to_log: 0.10     # écart minimum pour journaliser un signal (réduit le bruit)
  # Scan triangulaire INFORMATIONNEL inter-DEX (voir
  # app.trading.triangular.run_cross_dex_triangular_scan) : cycles dont les 3
  # jambes peuvent être sur des DEX différents. JAMAIS exécutable
  # automatiquement (aucune transaction atomique ne peut router 3 jambes vers
  # 3 DEX différents sans redéployer FlashArbitrage.sol) — consultable via
  # /api/cross-dex-triangular. Seuil volontairement plus élevé que
  # min_spread_pct_to_log pour ne pas noyer la base avec du bruit non actionnable.
  cross_dex_min_spread_pct_to_log: 0.50
  # Seuil de rentabilité à 5 $ de capital : un seuil fixe en $ n'a plus de sens
  # (0,50 $ est inatteignable sur un trade de 3 $). "would_execute" exige à la
  # fois un plancher absolu minimal ET un profit net relatif à la taille du trade.
  min_net_profit_usd: 0.01
  min_net_profit_pct: 0.5

  # Historique d'exécution par paire (succès/échecs RÉELS, pas la simulation) :
  # relève le seuil de profit exigé pour une paire qui échoue souvent
  # récemment, et l'exclut temporairement après une série d'échecs
  # consécutifs — voir app/trading/pair_health.py pour le détail du calcul.
  # Mettre à false pour revenir au comportement précédent (seuil fixe,
  # aucune désactivation automatique).
  pair_health_enabled: true
  adaptive_profit_lookback: 20          # nombre de tentatives passées considérées par paire
  adaptive_profit_min_samples: 5        # pas d'ajustement tant qu'il n'y a pas au moins ce nombre de tentatives
  adaptive_profit_penalty_factor: 2.0   # seuil x2 maximum pour une paire en échec systématique (0% de réussite)
  auto_disable_consecutive_failures: 3  # nombre d'échecs d'affilée avant mise en pause de la paire
  auto_disable_cooldown_minutes: 120    # durée de la pause avant de retenter la paire

  # Exécution financée par flashloan Aave V3 (contrat FlashArbitrage déjà
  # déployé sur Base mainnet, voir contracts/README.md pour l'adresse et le
  # tx hash de déploiement). Permet de trader un montant INDÉPENDANT du solde
  # réel du wallet (le montant emprunté n'est JAMAIS le capital du wallet —
  # seul le gas de la tentative est en jeu : la transaction revert ENTIÈREMENT
  # si le profit net minimum n'est pas couvert, voir
  # contracts/FlashArbitrage.sol::executeOperation). ACTIVÉ le 2026-10-08
  # (décision explicite de l'utilisateur), EN PLUS de
  # `enabled`/`TRADING_ENABLED`/`TRADING_LIVE_CONFIRMED` ci-dessus (voir
  # app/trading/guardrails.py::is_trading_live, toujours requis en plus).
  # Uniswap V3, aerodrome, sushiswap, pancakeswap, baseswap, alien-base et
  # swapbased sont éligibles à cette voie (voir
  # app/trading/flashloan.py::FLASHLOAN_CAPABLE_DEXES).
  flashloan_enabled: true
  # Plafond du montant notionnel empruntable par flashloan, en $ (indépendant
  # du solde réel du wallet). Le notionnel RÉELLEMENT utilisé est désormais
  # OPTIMISÉ (recherche ternaire sur la fonction de profit, concave en
  # notionnel — voir app/trading/flashloan.py::_optimal_flashloan_notional_usd)
  # dans l'intervalle [0, ce plafond], lui-même toujours borné par
  # `liquidity_safety_fraction` ci-dessus (2% de la plus petite liquidité de
  # pool parmi les jambes du cycle) : cette valeur reste un plafond de risque
  # configurable, pas le montant systématiquement emprunté.
  #
  # Relevé le 08/10 de 1000$ à 10000$ : vérification DexScreener en
  # production a confirmé que ce plafond à 1000$ était le facteur BLOQUANT
  # (pas la liquidité réelle des pools) sur les paires flashloan les plus
  # rentables observées : BRETT/WETH aerodrome↔pancakeswap (liquidité min.
  # ~195k$ → borne réelle liquidity_safety_fraction ≈3900$), BRETT/WETH
  # uniswap↔aerodrome (liquidité min. ~827k$ → borne ≈16500$), VIRTUAL/WETH
  # (liquidité min. ~352k$ → borne ≈7000$), MORPHO/WETH (liquidité min.
  # ~908k$ → borne ≈18000$). Le nouveau plafond (10000$) reste strictement
  # borné individuellement par `liquidity_safety_fraction` pour CHAQUE paire
  # (ex. DEGEN/WETH via aerodrome, liquidité ~33k$ → reste capé à ≈650$ même
  # avec ce plafond relevé) : aucune paire ne peut dépasser sa propre borne de
  # sécurité liée à sa liquidité réelle, seul le plafond artificiel qui
  # empêchait d'exploiter pleinement les paires les plus liquides est levé.
  flashloan_notional_usd: 10000
  # Profit net minimum exigé (frais DEX + prime flashloan Aave ~0,05% +
  # tampon de slippage + gas déjà déduits) pour tenter un flashloan —
  # volontairement plus élevé que min_net_profit_usd classique : chaque
  # tentative, même en cas de revert, coûte du gas réel immédiatement.
  # Abaissé de 1.0$ à 0.3$ le 08/10, puis à 0.1$ le 08/10 (même jour) : le gas
  # Base est bon marché (quelques centimes) et un revert ne touche jamais au
  # capital emprunté (atomique), donc un seuil plus bas capture des
  # opportunités réelles (ex. BRETT/WETH ~0.1-0.5$ net) sans risque de perte
  # de capital, juste plus de tentatives (et donc plus de gas cumulé en cas
  # de reverts répétés si le marché bouge entre détection et exécution).
  flashloan_min_net_profit_usd: 0.1

