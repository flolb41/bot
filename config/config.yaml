# Configuration du Crypto Reward Hunter.
# Les secrets (token Telegram, etc.) viennent du fichier .env (jamais ici en clair).

logging:
  level: INFO
  file: logs/app.log

database:
  path: data/reward_hunter.db

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

scheduler:
  scan_interval_minutes: 30   # fréquence de scan des pages officielles (Phase 1)
  deadline_check_hour: 8      # heure UTC de vérification des échéances
  digest_hour: 9              # heure UTC d'envoi du digest quotidien "opportunité du jour"
  opportunity_scan_interval_minutes: 120  # fréquence du scan de micro-récompenses (section 16 étendue)
  discovery_scan_interval_minutes: 1440   # fréquence de découverte de nouveaux projets (1x/jour, sources publiques limitées en débit)
  arbitrage_scan_interval_minutes: 5      # fréquence du scan d'arbitrage inter-DEX (bot de trading, phase simulation)

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8000

# Plafond de coût accepté pour qu'une campagne reste considérée "0 € de capital".
risk:
  max_acceptable_cost_eur: 0.0
  max_gas_per_tx_native: 0.01       # limite indicative (reprise par AUTOSIGN_MAX_GAS_PRICE_GWEI)
  max_amount_per_tx_eur: 0.0        # aucune transaction automatique n'est signée en phase 1-3

# Auto-signature (Phase 4 du TODO — "interactions"). Garde-fous obligatoires avant
# toute automatisation : whitelist de contrats, limites de gas/montant, simulation
# préalable, arrêt automatique en cas d'anomalie (voir app/wallet/autosign.py).
# TOUT vient du .env — par défaut AUTOSIGN_ENABLED=false : aucune transaction n'est
# envoyée tant que tu ne l'actives pas explicitement après des tests en dry-run.
autosign:
  enabled: "${AUTOSIGN_ENABLED}"
  wallet_address: "${WALLET_AUTOSIGNER_ADDRESS}"
  wallet_network: "${WALLET_AUTOSIGNER_NETWORK}"
  contract_whitelist: "${AUTOSIGN_CONTRACT_WHITELIST}"   # adresses séparées par des virgules
  max_value_native: "${AUTOSIGN_MAX_VALUE_NATIVE}"
  max_gas_price_gwei: "${AUTOSIGN_MAX_GAS_PRICE_GWEI}"
  max_tx_per_day: "${AUTOSIGN_MAX_TX_PER_DAY}"
  min_profit_margin_eur: "${AUTOSIGN_MIN_PROFIT_MARGIN_EUR}"  # marge exigée en plus des frais (section 16 étendue)

# Répartition indicative des rewards reçus (section 11 du TODO) — appliquée manuellement.
rewards_allocation:
  keep_percent: 50
  stablecoin_percent: 25
  trading_reserve_percent: 25

# Wallets suivis en LECTURE SEULE (balances only, section 4 du TODO).
# Les adresses viennent exclusivement du .env : tant que WALLET_*_EVM_ADDRESS
# est vide, le wallet correspondant n'est pas enregistré. Aucune seed phrase
# ni private key ne doit JAMAIS apparaître ici ni dans le .env.
wallets:
  - name: farming
    address: "${WALLET_FARM_EVM_ADDRESS}"
    network: "${WALLET_FARM_EVM_NETWORK}"
    purpose: "Wallet dédié au farming d'airdrops/testnets — jamais le wallet personnel."
  - name: rewards
    address: "${WALLET_REWARDS_EVM_ADDRESS}"
    network: "${WALLET_REWARDS_EVM_NETWORK}"
    purpose: "Wallet de réception des rewards convertis (section 11 du TODO)."
  - name: autosigner
    address: "${WALLET_AUTOSIGNER_ADDRESS}"
    network: "${WALLET_AUTOSIGNER_NETWORK}"
    purpose: "Wallet opérationnel pour l'auto-signature (Phase 4) — solde minimal, rewards balayés régulièrement vers le wallet personnel."

# Bot de trading : arbitrage inter-DEX sur Base (demande "microtrades + seuil de
# rentabilité"). PHASE 2 = EXÉCUTION LIVE ACTIVÉE (décision explicite de
# l'utilisateur le 2026-10-07, confirmée après rappel des risques). `enabled: true`
# ne suffit PAS à lui seul : voir app/trading/guardrails.py::is_trading_live —
# il faut EN PLUS TRADING_ENABLED=true et TRADING_LIVE_CONFIRMED=<phrase exacte>
# dans le .env du Pi (jamais ici), et un wallet de trading importé + approvisionné.
#
# Capital de test ciblé par l'utilisateur : 5 $ (wallet MetaMask principal,
# décision explicite malgré le risque signalé). `max_trade_size_usd` et les
# seuils de rentabilité ci-dessous sont calibrés pour ce montant : à ce stade
# les frais de gas Base (quelques millièmes de $) sont négligeables, ce sont
# les frais DEX (~0,6 % aller-retour) + la marge de slippage qui dominent le
# seuil de rentabilité réel.
trading:
  enabled: true
  chain: base
  dex_whitelist: [uniswap, aerodrome, sushiswap, pancakeswap]
  # Tokens de départ pour la recherche de paires inter-DEX (adresses Base
  # vérifiées via DEUX sources indépendantes — DEX Screener + CoinGecko — avant
  # ajout ici : ne jamais ajouter une adresse non recoupée de cette façon).
  seed_tokens:
    - symbol: WETH
      address: "0x4200000000000000000000000000000000000006"
      coingecko_id: ethereum
    - symbol: USDC
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      coingecko_id: usd-coin
    - symbol: AERO
      address: "0x940181a94A35A4569E4529A3CDfB74e38FD98631"
      coingecko_id: aerodrome-finance
    - symbol: cbETH
      address: "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"
      coingecko_id: coinbase-wrapped-staked-eth
    - symbol: cbBTC
      address: "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"
      coingecko_id: coinbase-wrapped-btc
  min_liquidity_usd: 10000        # ignore les pools trop fines (risque de prix manipulé/non réaliste)
  max_trade_size_usd: 3           # calibré pour un capital de test de 5 $ (garde une marge pour le gas)
  liquidity_safety_fraction: 0.02 # taille de trade ≤ 2% de la plus petite liquidité des deux pools
  min_spread_pct_to_log: 0.10     # écart minimum pour journaliser un signal (réduit le bruit)
  # Seuil de rentabilité à 5 $ de capital : un seuil fixe en $ n'a plus de sens
  # (0,50 $ est inatteignable sur un trade de 3 $). "would_execute" exige à la
  # fois un plancher absolu minimal ET un profit net relatif à la taille du trade.
  min_net_profit_usd: 0.01
  min_net_profit_pct: 0.5

